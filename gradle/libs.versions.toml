[versions]
agp = "9.2.1"
activityCompose = "1.13.0"
composeBom = "2026.04.01"
coreKtx = "1.18.0"
coroutines = "1.10.2"
datastore = "1.2.1"
junit = "4.13.2"
junitVersion = "1.1.5"
