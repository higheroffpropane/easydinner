name: Android and recipe server

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            11
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test recipe server and Android client, then build debug APK
        run: ./gradlew :server:test :app:testDebugUnitTest :app:assembleDebug --stacktrace
